    <title>视频剪辑姬（Video Cutie）v1.2.0-beta.7 - macOS 视频无损剪辑工具</title>
    <meta name="description" content="视频剪辑姬 (Video Cutie) v1.2.0-beta.7 - 专为 macOS 设计的原生视频极速无损裁剪客户端。内置 FFmpeg 原生引擎，支持拖拽视频、自动补全时间格式(012536 -> 01:25:36)、原画音视频流复制无损裁剪(-c copy)、GitHub Actions 自动化构建通用 DMG 安装包。" />
    <meta property="og:title" content="视频剪辑姬（Video Cutie）v1.2.0-beta.7 - macOS 视频无损剪辑工具" />
    <meta property="og:description" content="视频剪辑姬 (Video Cutie) v1.2.0-beta.7 - 专为 macOS 设计的原生视频极速无损裁剪客户端。内置 FFmpeg 原生引擎，支持拖拽视频、自动补全时间格式(012536 -> 01:25:36)、原画音视频流复制无损裁剪(-c copy)、GitHub Actions 自动化构建通用 DMG 安装包。" />

    <link rel="icon" type="image/png" href="/src/assets/app_icon.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('videocutie_theme');
          var isDark = saved ? (saved === 'dark') : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
