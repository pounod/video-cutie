name: 视频剪辑姬（Video Cutie）- macOS Universal DMG 构建与发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 1.2.5)'
        required: true
        default: '1.2.5'
      release_title:
        description: 'GitHub Release 标题'
        required: true
        default: '视频剪辑姬（Video Cutie）v1.2.5'
      create_release:
        description: '构建完成后是否自动在 GitHub Releases 发布'
        required: true
        type: boolean
        default: true
      prerelease:
        description: '是否发布为 Pre-release 预发布版本'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: 构建内置 FFmpeg 的 macOS Universal 客户端与 DMG
    runs-on: macos-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v6

      - name: 安装 Node.js 运行时
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: 安装项目依赖 (配置 macOS 原生环境)
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: 构建 Web 客户端界面资源
        run: |
          npm run build

      - name: 安装打包工具与 Universal (arm64 + x86_64) FFmpeg 原生引擎
        run: |
          brew install create-dmg || true
          mkdir -p build/ffmpeg-universal /tmp/ffmpeg-dl
          echo "⬇️ 正在获取官方独立静态 FFmpeg (arm64 与 x86_64 架构)..."
          curl -fsSL --retry 3 --connect-timeout 10 "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64.gz" | gzip -d > /tmp/ffmpeg-dl/ffmpeg-arm64 || true
          curl -fsSL --retry 3 --connect-timeout 10 "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-x64.gz" | gzip -d > /tmp/ffmpeg-dl/ffmpeg-x64 || true
          if [ -s "/tmp/ffmpeg-dl/ffmpeg-arm64" ] && [ -s "/tmp/ffmpeg-dl/ffmpeg-x64" ]; then
            chmod +x /tmp/ffmpeg-dl/ffmpeg-arm64 /tmp/ffmpeg-dl/ffmpeg-x64
            lipo -create /tmp/ffmpeg-dl/ffmpeg-arm64 /tmp/ffmpeg-dl/ffmpeg-x64 -output build/ffmpeg-universal/ffmpeg
            chmod +x build/ffmpeg-universal/ffmpeg
            echo "✅ 成功使用 lipo 合成 Universal (arm64 + x86_64) 双架构 FFmpeg 原生二进制！"
            lipo -info build/ffmpeg-universal/ffmpeg || true
          else
            echo "⚠️ 静态双架构下载不完整，备用安装本地 Homebrew ffmpeg..."
            brew install ffmpeg || true
          fi

      - name: 编译原生客户端、打包内置 FFmpeg 并生成 Universal DMG
        env:
          APP_VERSION: ${{ github.event.inputs.version || '1.2.5' }}
          APP_NAME_ZH: "视频剪辑姬"
          APP_NAME_EN: "Video Cutie"
        run: |
          chmod +x ./scripts/build-dmg.sh
          ./scripts/build-dmg.sh "${{ github.event.inputs.version || '1.2.5' }}"

      - name: 准备优化完成汇报 (Release Notes)
        id: release_notes
        run: |
          TARGET_VER="${{ github.event.inputs.version || '1.2.5' }}"
          echo "🔍 正在匹配版本 v${TARGET_VER} 的优化完成验收报告..."
          if [ -f "RELEASE_REPORT_v${TARGET_VER}.md" ]; then
            echo "notes_file=RELEASE_REPORT_v${TARGET_VER}.md" >> $GITHUB_OUTPUT
            echo "✅ 已匹配到指定版本验收报告: RELEASE_REPORT_v${TARGET_VER}.md"
          elif [ -f "RELEASE_REPORT_LATEST.md" ]; then
            echo "notes_file=RELEASE_REPORT_LATEST.md" >> $GITHUB_OUTPUT
            echo "✅ 使用最新综合验收报告: RELEASE_REPORT_LATEST.md"
          elif [ -f "RELEASE_REPORT_v1.2.5.md" ]; then
            echo "notes_file=RELEASE_REPORT_v1.2.5.md" >> $GITHUB_OUTPUT
            echo "✅ 使用 v1.2.5 验收报告: RELEASE_REPORT_v1.2.5.md"
          elif [ -f "RELEASE_REPORT_v1.2.0.md" ]; then
            echo "notes_file=RELEASE_REPORT_v1.2.0.md" >> $GITHUB_OUTPUT
          else
            echo "notes_file=README.md" >> $GITHUB_OUTPUT
          fi

      - name: 上传构建产物 Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: VideoCutie-macOS-Universal-DMG
          path: |
            dist-dmg/*.dmg
            dist-dmg/*.zip

      - name: 在 GitHub Releases 中自动发布
        if: ${{ github.event.inputs.create_release != false }}
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.event.inputs.release_title || '视频剪辑姬（Video Cutie）v1.2.5' }}
          tag_name: "v${{ github.event.inputs.version || '1.2.5' }}"
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == true || github.event.inputs.prerelease == 'true' }}
          files: |
            dist-dmg/*.dmg
            dist-dmg/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
