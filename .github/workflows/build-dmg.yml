name: 视频剪辑姬（Video Cutie）- macOS Universal DMG 构建与发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (如 1.1)'
        required: true
        default: '1.1'
      release_title:
        description: 'GitHub Release 标题'
        required: true
        default: '视频剪辑姬（Video Cutie）v1.1'
      create_release:
        description: '构建完成后是否自动在 GitHub Releases 发布'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: 构建 macOS Universal DMG (.dmg)
    runs-on: macos-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 运行时
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装项目依赖
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: 构建 Web 应用前端产物
        run: |
          npm run build

      - name: 安装 DMG 打包工具 (create-dmg)
        run: |
          brew install create-dmg || true

      - name: 执行 Universal DMG 打包脚本
        env:
          APP_VERSION: ${{ github.event.inputs.version || '1.1' }}
          APP_NAME_ZH: "视频剪辑姬"
          APP_NAME_EN: "Video Cutie"
        run: |
          chmod +x ./scripts/build-dmg.sh
          ./scripts/build-dmg.sh "${{ github.event.inputs.version || '1.1' }}"

      - name: 准备优化完成汇报 (Release Notes)
        id: release_notes
        run: |
          if [ -f "RELEASE_REPORT_v1.1.md" ]; then
            echo "notes_file=RELEASE_REPORT_v1.1.md" >> $GITHUB_OUTPUT
          else
            echo "## 视频剪辑姬（Video Cutie）v1.1 优化完成汇报" > RELEASE_NOTES.md
            echo "本次更新主要优化了音视频流无损复制、时间格式智能自动补全以及 GitHub Actions 自动化构建 DMG。" >> RELEASE_NOTES.md
            echo "notes_file=RELEASE_NOTES.md" >> $GITHUB_OUTPUT
          fi

      - name: 上传构建产物 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoCutie-macOS-Universal-DMG
          path: |
            dist-dmg/*.dmg
            dist-dmg/*.zip

      - name: 在 GitHub Releases 中自动发布
        if: ${{ github.event.inputs.create_release != false }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event.inputs.release_title || '视频剪辑姬（Video Cutie）v1.1' }}
          tag_name: "v${{ github.event.inputs.version || '1.1' }}"
          body_path: ${{ steps.release_notes.outputs.notes_file }}
          draft: false
          prerelease: false
          files: |
            dist-dmg/*.dmg
            dist-dmg/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
